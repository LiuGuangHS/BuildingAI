<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" href="/echoflowai-favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="EchoFlowAI" />
    <meta name="apple-mobile-web-app-title" content="EchoFlowAI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      (function () {
        const storageKey = "echoflowai-client-theme";
        const colorStorageKey = "echoflowai-client-theme-color";

        const theme = localStorage.getItem(storageKey) || "system";
        if (
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.add("light");
        }

        const themeColor = localStorage.getItem(colorStorageKey) || "indigo";
        document.documentElement.classList.add("theme-" + themeColor);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
